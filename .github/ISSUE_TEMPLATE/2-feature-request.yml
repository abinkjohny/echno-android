name: Feature request
description: Suggest something the app should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this, and what they can't do today.
      placeholder: Site engineers can't …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work in the app. Sketches or screenshots of the web app help.
    validations:
      required: true
  - type: textarea
    id: backend
    attributes:
      label: Backend support
      description: Does the backend already have the endpoints this needs? Link them if you know.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
