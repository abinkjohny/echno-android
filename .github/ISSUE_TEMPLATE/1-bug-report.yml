name: Bug report
description: Something in the app doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through SECURITY.md instead, not a public issue.
        Never paste tokens, passwords or other people's personal data here.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, including any error message on screen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a member of two organizations
        2. Open …
        3. Tap …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - dev
        - staging
        - prod
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → Apps → Echno → App details, or the commit you built from.
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16 / emulator, API 36
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Hide tokens and other people's personal data.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logcat output, with tokens and personal data removed.
      render: text
