name: Task
description: Planned work that isn't a bug or a new feature, such as a refactor, a dependency update or tooling.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] …
        - [ ] …
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Related issues, pull requests or backend changes.
