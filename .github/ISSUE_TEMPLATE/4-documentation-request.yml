name: Documentation request
description: Something in the README, docs/ or the code comments is missing, wrong or unclear.
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: The file, section or link.
      placeholder: docs/architecture.md → Networking
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong
      options:
        - Missing
        - Wrong or out of date
        - Unclear
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Details
      description: What you were trying to do, and what the documentation should say.
    validations:
      required: true
